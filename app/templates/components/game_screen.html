<div id="game-container">
<div class="app-shell">
    <section class="panel flex flex-col p-4">
        <header class="flex items-center justify-between panel-soft rounded-xl px-3 py-2 mb-4 reveal">
            <button
                hx-post="/reset"
                hx-target="#game-container"
                hx-swap="outerHTML"
                class="btn-ghost text-sm">
                ← Back
            </button>
            <h1 class="font-display font-bold text-gray-900">Soc Ops</h1>
            <div class="w-16"></div>
        </header>

        <p class="text-center text-gray-500 text-sm px-4 mb-4 reveal delay-1">
            Tap a square when you find someone who matches it.
        </p>

        {% if session.has_bingo %}
        <div class="badge-bingo text-center py-2 px-4 font-semibold text-sm rounded-lg mb-4 reveal delay-1">
            🎉 BINGO! You got a line!
        </div>
        {% endif %}

        <div class="flex-1 flex items-center justify-center pb-2 reveal delay-2">
            {% include "components/bingo_board.html" %}
        </div>
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
