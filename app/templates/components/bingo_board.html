<div class="board-frame">
    <div class="grid grid-cols-5 gap-2 w-full mx-auto aspect-square">
        {% for square in session.board %}
        {% set is_winning = square.id in session.winning_square_ids %}
        <button
            {% if not square.is_free_space %}
            hx-post="/toggle/{{ square.id }}"
            hx-target="#game-container"
            hx-swap="outerHTML"
            {% endif %}
            {% if square.is_free_space %}disabled{% endif %}
            class="relative flex items-center justify-center p-1 text-center border rounded-lg transition-all duration-150 select-none min-h-[68px] text-xs leading-tight
            {%- if square.is_marked %}
                {%- if is_winning %} square-winning
                {%- else %} square-marked
                {%- endif %}
            {%- else %} square-default
            {%- endif %}
            {%- if square.is_free_space %} font-bold text-sm tracking-wide{% endif %}"
            aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
            aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
            <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
            {% if square.is_marked and not square.is_free_space %}
            <span class="absolute top-0.5 right-0.5 text-green-600 text-xs">✓</span>
            {% endif %}
        </button>
        {% endfor %}
    </div>
</div>
